<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super max zip hoodie — Summer Break Sadness</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="back-link" href="index.html" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M15 4L7 12l8 8"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="square"
            stroke-linejoin="miter"
          />
        </svg>
      </a>
      <a class="logo-link" href="index.html" aria-label="Home">
        <span class="logo" aria-hidden="true">
          <span class="logo__tile"><span class="logo__light"></span></span>
          <span class="logo__tile"><span class="logo__light"></span></span>
          <span class="logo__tile"><span class="logo__light"></span></span>
          <span class="logo__tile"><span class="logo__light"></span></span>
          <span class="logo__tile"><span class="logo__light"></span></span>
        </span>
      </a>
      <select class="currency-selector" aria-label="Currency">
        <option value="AUD">AUD</option>
        <option value="USD">USD</option>
        <option value="NZD">NZD</option>
        <option value="GBP">GBP</option>
        <option value="EUR">EUR</option>
      </select>
      <button class="cart-link" type="button" aria-label="Racing cart">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 6h2l1.2 9.5a1 1 0 0 0 1 .85h8.6a1 1 0 0 0 1-.8L19 8H7"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="square"
            stroke-linejoin="miter"
          />
          <circle cx="10" cy="20" r="1.15" fill="currentColor" />
          <circle cx="16.5" cy="20" r="1.15" fill="currentColor" />
        </svg>
        <span class="cart-count" hidden aria-hidden="true">0</span>
      </button>
      <p class="cart-message" aria-live="polite">Your racing cart is empty</p>
    </header>

    <main class="product-page">
      <div class="product-layout">
        <div class="product-media product-media--hoodie">
          <img src="assets/hoodie.png" alt="Super max zip hoodie" />
        </div>

        <div class="product-info">
          <h1>Super max zip hoodie</h1>
          <p class="product-price" data-product="hoodie"></p>

          <div class="size-row" role="group" aria-label="Sizes">
            <button class="size-btn is-selected" type="button" data-size="S">S</button>
            <button class="size-btn" type="button" data-size="M">M</button>
            <button class="size-btn" type="button" data-size="L">L</button>
            <button class="size-btn" type="button" data-size="XL">XL</button>
            <span class="fabric">100% cotton<span class="fit">Women's fit</span></span>
          </div>

          <p class="status" aria-live="polite"></p>

          <details class="size-chart">
            <summary>Size chart <span>(cm)</span></summary>
            <div class="size-chart__scroll">
              <table>
                <thead>
                  <tr>
                    <th scope="col">Size</th>
                    <th scope="col">Body length</th>
                    <th scope="col">Pit-to-pit</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th scope="row">S</th>
                    <td>62</td>
                    <td>57</td>
                  </tr>
                  <tr>
                    <th scope="row">M</th>
                    <td>64</td>
                    <td>59.5</td>
                  </tr>
                  <tr>
                    <th scope="row">L</th>
                    <td>66</td>
                    <td>62</td>
                  </tr>
                  <tr>
                    <th scope="row">XL</th>
                    <td>68</td>
                    <td>64.5</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </details>
        </div>
      </div>
    </main>

    <script src="js/logo.js"></script>
    <script src="js/price.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
